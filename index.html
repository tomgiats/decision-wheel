<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A1A2E">
  <title>Decision Wheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f7fb;
      --muted: #aebbd0;
      --card: #16213E;
      --line: #0F3460;
      --purple: #8c71ab;
      --purple-dark: #533483;
      --shadow: 0 12px 28px rgba(0, 0, 0, .24);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1A1A2E;
    }
    main { width: min(100%, 540px); margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom)); }
    header { text-align: center; margin: 2px 0 20px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 7vw, 2.15rem); font-weight:600; letter-spacing: -.055em; }
    header p { margin: 7px 0 0; color: var(--muted); font-size: .95rem; font-weight:400; }
    .wheel-stage { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 4px auto 20px; }
    .pointer {
      position: absolute; z-index: 2; top: -8px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 31px solid #E94560;
      filter: drop-shadow(0 3px 2px rgba(36,25,86,.2));
    }
    .wheel-shell { width: 100%; height: 100%; border-radius: 50%; padding: 6px; background: #16213E; box-shadow: 0 14px 30px rgba(0,0,0,.38), inset 0 0 0 1px rgba(255,255,255,.08); }
    #wheel { display:block; width:100%; height:100%; border-radius:50%; touch-action:none; transition: transform 4.8s cubic-bezier(.12,.72,.1,1); will-change: transform; }
    .hub { position:absolute; top:50%; left:50%; width:40px; height:40px; transform:translate(-50%,-50%); border-radius:50%; background:#1A1A2E; box-shadow:0 2px 8px rgba(0,0,0,.38), inset 0 0 0 6px #0F3460; pointer-events:none; }
    .card { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 10px; padding: 17px; }
    .controls { display:grid; gap:14px; }
    label { display:block; color: var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    input, select { width:100%; margin-top:7px; min-height:46px; border:1px solid var(--line); border-radius:7px; background:#1A1A2E; color:var(--ink); font:inherit; font-size:1rem; padding:0 13px; outline:none; }
    input:focus, select:focus { border-color:#533483; box-shadow:0 0 0 3px rgba(83,52,131,.32); }
    .stepper { display:grid; grid-template-columns:46px 1fr 46px; gap:7px; margin-top:7px; }
    .stepper input { min-width:0; margin:0; text-align:center; font-weight:600; }
    .stepper button { width:46px; min-height:46px; padding:0; border-radius:7px; background:#533483; color:#fff; font:500 1.5rem/1 "Inter", sans-serif; box-shadow:none; }
    .option-heading { display:flex; align-items:center; justify-content:space-between; margin-top:3px; }
    .option-heading span { color:var(--muted); font-size:.82rem; }
    #option-list { display:grid; gap:9px; }
    .option-row { display:grid; grid-template-columns:35px 1fr; gap:9px; align-items:center; }
    .badge { display:grid; place-items:center; width:34px; height:34px; border-radius:6px; color:#f0dce1; background:#533483; font-weight:700; }
    .option-row input { margin:0; min-height:40px; font-size:.94rem; }
    button { width:100%; min-height:54px; border:0; border-radius:8px; background:#E94560; color:#fff; font:700 1.05rem/1 "Inter", -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:.01em; box-shadow:none; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .15s ease, filter .15s ease; }
    button:active { transform:scale(.98); filter:brightness(.96); }
    button:disabled { opacity:.55; cursor:default; }
    #result { min-height:27px; margin:13px 0 0; text-align:center; color:#f08b9b; font-weight:600; font-size:1rem; }
    .hint { text-align:center; color:var(--muted); font-size:.77rem; margin:14px 0 0; }
    @media (min-width: 500px) { main { padding-top:36px; } .wheel-stage { margin-bottom:24px; } .card { padding:20px; } }
    @media (prefers-reduced-motion: reduce) { #wheel { transition-duration:.01ms; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="display-title">Decision Wheel</h1>
      <p>Spin your way to a decision.</p>
    </header>

    <section class="wheel-stage" aria-label="Decision wheel">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel-shell"><canvas id="wheel" aria-label="Decision wheel with options A and B"></canvas></div>
      <div class="hub" aria-hidden="true"></div>
    </section>

    <button id="spin" type="button">Spin the wheel</button>
    <p id="result" role="status" aria-live="polite"></p>

    <section class="card controls" aria-label="Rad bearbeiten">
      <label>Wheel title
        <input id="wheel-title" type="text" maxlength="40" placeholder="Decision Wheel" autocomplete="off">
      </label>
      <label>Number of options
        <div class="stepper" role="group" aria-label="Number of options">
          <button id="decrease-count" type="button" aria-label="Remove one option">−</button>
          <input id="count" type="text" value="2" readonly aria-label="Number of options">
          <button id="increase-count" type="button" aria-label="Add one option">+</button>
        </div>
      </label>
      <div class="option-heading"><label for="option-list">Options</label><span>blank = letter</span></div>
      <div id="option-list"></div>
    </section>
    <p class="hint">Drag the wheel to spin it. Tap it to stop.</p>
  </main>

  <script>
    const palette = ['#0F3460', '#533483', '#E94560', '#16213E', '#1A1A2E'];
    const canvas = document.querySelector('#wheel');
    const ctx = canvas.getContext('2d');
    const count = document.querySelector('#count');
    const decreaseCount = document.querySelector('#decrease-count');
    const increaseCount = document.querySelector('#increase-count');
    const optionList = document.querySelector('#option-list');
    const titleInput = document.querySelector('#wheel-title');
    const displayTitle = document.querySelector('#display-title');
    const spin = document.querySelector('#spin');
    const result = document.querySelector('#result');
    let values = ['', ''];
    let angle = 0;
    let spinning = false;
    let spinTimer;
    let dragState = null;
    let inertiaFrame;

    const letter = index => String.fromCharCode(65 + index);
    const labels = () => values.map((value, index) => value.trim() || letter(index));

    function renderOptions() {
      const target = Number(count.value);
      values = Array.from({ length: target }, (_, i) => values[i] || '');
      optionList.innerHTML = '';
      values.forEach((value, index) => {
        const row = document.createElement('div');
        row.className = 'option-row';
        row.innerHTML = `<span class="badge">${letter(index)}</span><input type="text" maxlength="22" value="${escapeHTML(value)}" placeholder="${letter(index)}" aria-label="Title for option ${letter(index)}" autocomplete="off">`;
        row.querySelector('input').addEventListener('input', event => {
          values[index] = event.target.value;
          drawWheel();
        });
        optionList.append(row);
      });
      drawWheel();
      decreaseCount.disabled = values.length === 2;
      increaseCount.disabled = values.length === 8;
    }

    function escapeHTML(value) {
      const node = document.createElement('span');
      node.textContent = value;
      return node.innerHTML;
    }

    function drawWheel() {
      const size = canvas.clientWidth;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);
      const center = size / 2, radius = center - 1, segment = Math.PI * 2 / values.length;
      const optionLabels = labels();
      optionLabels.forEach((label, index) => {
        const start = -Math.PI / 2 + index * segment;
        ctx.beginPath(); ctx.moveTo(center, center); ctx.arc(center, center, radius, start, start + segment); ctx.closePath();
        ctx.fillStyle = palette[index % palette.length]; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.save(); ctx.translate(center, center); ctx.rotate(start + segment / 2); ctx.fillStyle = '#fff';
        ctx.font = `700 ${Math.max(13, Math.min(20, size / 14))}px Inter, -apple-system, sans-serif`;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        const max = radius * .61;
        let text = label;
        while (ctx.measureText(text).width > max && text.length > 2) text = text.slice(0, -2) + '…';
        ctx.fillText(text, radius * .78, 0); ctx.restore();
      });
    }

    function updateTitle() {
      displayTitle.textContent = titleInput.value.trim() || 'Decision Wheel';
      document.title = displayTitle.textContent;
    }

    function setRotation() {
      canvas.style.transform = `rotate(${angle}deg)`;
    }

    function stopInertia() {
      if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
      inertiaFrame = undefined;
    }

    function stopSpin() {
      if (!spinning) return;
      clearTimeout(spinTimer);
      const matrix = new DOMMatrixReadOnly(getComputedStyle(canvas).transform);
      const visibleAngle = Math.atan2(matrix.b, matrix.a) * 180 / Math.PI;
      angle = visibleAngle + Math.round((angle - visibleAngle) / 360) * 360;
      canvas.style.transition = 'none';
      setRotation();
      spinning = false;
      spin.disabled = false;
      result.textContent = 'Stopped';
    }

    function pointerAngle(event) {
      const bounds = canvas.getBoundingClientRect();
      return Math.atan2(event.clientY - bounds.top - bounds.height / 2, event.clientX - bounds.left - bounds.width / 2) * 180 / Math.PI;
    }

    function angleDelta(current, previous) {
      return ((current - previous + 540) % 360) - 180;
    }

    function coast(velocity) {
      stopInertia();
      const animate = () => {
        angle += velocity * 16.67;
        velocity *= .94;
        setRotation();
        if (Math.abs(velocity) > .018) inertiaFrame = requestAnimationFrame(animate);
        else { inertiaFrame = undefined; canvas.style.transition = ''; }
      };
      inertiaFrame = requestAnimationFrame(animate);
    }

    canvas.addEventListener('pointerdown', event => {
      if (spinning) { stopSpin(); return; }
      stopInertia();
      canvas.style.transition = 'none';
      canvas.setPointerCapture(event.pointerId);
      dragState = { pointerId: event.pointerId, previous: pointerAngle(event), time: performance.now(), velocity: 0, moved: false };
    });

    canvas.addEventListener('pointermove', event => {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      const now = performance.now();
      const current = pointerAngle(event);
      const delta = angleDelta(current, dragState.previous);
      angle += delta;
      dragState.velocity = delta / Math.max(now - dragState.time, 1);
      dragState.moved ||= Math.abs(delta) > .2;
      dragState.previous = current;
      dragState.time = now;
      setRotation();
    });

    function releaseWheel(event) {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      const { velocity, moved } = dragState;
      dragState = null;
      if (moved && Math.abs(velocity) > .025) coast(velocity);
      else canvas.style.transition = '';
    }

    canvas.addEventListener('pointerup', releaseWheel);
    canvas.addEventListener('pointercancel', releaseWheel);

    function setCount(nextCount) {
      count.value = Math.max(2, Math.min(8, nextCount));
      result.textContent = '';
      renderOptions();
    }

    decreaseCount.addEventListener('click', () => setCount(Number(count.value) - 1));
    increaseCount.addEventListener('click', () => setCount(Number(count.value) + 1));
    titleInput.addEventListener('input', updateTitle);
    window.addEventListener('resize', drawWheel);

    spin.addEventListener('click', () => {
      if (spinning) return;
      stopInertia();
      spinning = true; spin.disabled = true; result.textContent = '';
      const selected = Math.floor(Math.random() * values.length);
      const segmentDegrees = 360 / values.length;
      // The selected segment's centre is aligned with the fixed top pointer.
      const target = 360 * (6 + Math.floor(Math.random() * 3)) - (selected * segmentDegrees + segmentDegrees / 2);
      angle += target - (angle % 360);
      canvas.style.transition = '';
      void canvas.offsetWidth;
      setRotation();
      spinTimer = window.setTimeout(() => {
        result.textContent = `Selected: ${labels()[selected]}`;
        spinning = false; spin.disabled = false;
      }, 4850);
    });

    renderOptions();
    updateTitle();
    // Canvas text is redrawn once Inter has finished loading.
    if (document.fonts) document.fonts.ready.then(drawWheel);
  </script>
</body>
</html>
